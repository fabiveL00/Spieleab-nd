        <button data-act="w-zero" data-v="0" aria-pressed="${!W.zero}">Normal</button>
        <button data-act="w-zero" data-v="1" aria-pressed="${!!W.zero}">Null-Risiko</button>
      </div>
      <span class="wz-mode-hint">${W.zero ? '0 angesagt: 0 Stiche = +10 × Runde, sonst −10 × Runde. Wolke kann retten.' : '20 + 10 je Stich, daneben −10 je Stich.'}</span>
    </div>` : '';
  if (tooFew) {
    body = `<div class="note"><b>Wizard braucht 3 bis 6 Spieler.</b> Ändere oben die Spielerliste.</div>`;
  } else if (!finished) {
    const dealer = ps[(roundNo - 1) % n];
    const bidSum = ps.reduce((s,p) => s + (d.bids[p] ?? 0), 0);
    const trickSum = ps.reduce((s,p) => s + (d.tricks[p] ?? 0), 0);
    const allBids = ps.every(p => d.bids[p] !== undefined);
    const allTricks = ps.every(p => d.tricks[p] !== undefined);
    const cl = d.cloud || null;
    const cloudOk = !cl || (cl.d === 1 || cl.d === -1) && d.bids[cl.p] !== undefined && d.bids[cl.p] + cl.d >= 0;
    const ok = allBids && allTricks && trickSum === roundNo && cloudOk;
    const stepper = (kind, p) => {
      const v = d[kind][p];
      return `<div class="step ${v === undefined ? 'unset' : ''}">
        <button data-act="w-step" data-kind="${kind}" data-p="${esc(p)}" data-d="-1" aria-label="${kind === 'bids' ? 'Ansage' : 'Stiche'} ${esc(p)} weniger">−</button>
        <output>${v === undefined ? '–' : v}</output>
        <button data-act="w-step" data-kind="${kind}" data-p="${esc(p)}" data-d="1" aria-label="${kind === 'bids' ? 'Ansage' : 'Stiche'} ${esc(p)} mehr">+</button>
      </div>`;
    };
    body = `<div class="round">
      <div class="round-head">
        <div><div class="label">${editing ? 'Runde korrigieren' : 'Aktuelle Runde'}${W.zero && W.rounds.length ? ' · <span class="zero-badge">Null-Risiko</span>' : ''}</div><div class="big">${roundNo}<small> / ${maxRounds}</small></div></div>
        <div class="label" style="text-align:right">${roundNo} ${roundNo === 1 ? 'Karte' : 'Karten'} pro Kopf<br>Geber: ${esc(dealer)}</div>
      </div>
      <div class="wz-grid">
        <div class="h">Spieler</div><div class="h">Ansage</div><div class="h">Stiche</div>
        ${ps.map(p => `<div class="wz-name">${esc(p)}${p === dealer ? '<span class="dealer">gibt</span>' : ''}${cl && cl.p === p && cl.d ? `<span class="dealer" style="color:var(--ink);border-color:var(--ink)">☁ ${d.bids[p] ?? '?'}→${(d.bids[p] ?? 0) + cl.d}</span>` : ''}</div>${stepper('bids',p)}${stepper('tricks',p)}`).join('')}
      </div>
      <div class="checks">
        <span>Ansagen: ${allBids ? bidSum : '…'} bei ${roundNo} Stichen ${allBids ? (bidSum === roundNo ? '· geht exakt auf' : bidSum > roundNo ? `· ${bidSum - roundNo} zu viel angesagt` : `· ${roundNo - bidSum} zu wenig angesagt`) : ''}</span>
        <span class="${allTricks && trickSum !== roundNo ? 'bad' : ''}">Stiche: ${trickSum} von ${roundNo}${allTricks && trickSum !== roundNo ? ' · passt nicht' : ''}</span>
        ${W.zero ? `<span>Null-Risiko: 0 angesagt = ±${roundNo * 10}</span>` : ''}
      </div>
      <div class="cloud">
        <label for="w-cloud">☁ Wolke gewonnen von</label>
        <select id="w-cloud" data-cloud-p>
          <option value="">niemand</option>
          ${ps.map(p => `<option value="${esc(p)}" ${cl && cl.p === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
        </select>
        ${cl ? `<div class="seg" role="group" aria-label="Ansage ändern">
          <button data-act="w-cloud-d" data-d="-1" aria-pressed="${cl.d === -1}">Ansage −1</button>
          <button data-act="w-cloud-d" data-d="1" aria-pressed="${cl.d === 1}">Ansage +1</button>
        </div>` : ''}
        ${cl && !cl.d ? `<span class="bad">+1 oder −1 wählen</span>` : ''}
        ${cl && cl.d === -1 && d.bids[cl.p] === 0 ? `<span class="bad">Ansage 0 kann nicht sinken</span>` : ''}
      </div>
      <div class="row between" style="margin-top:12px">
        ${editing ? `<button class="btn ghost small" data-act="w-back">Abbrechen</button>` : `<span></span>`}
        <button class="btn solid" data-act="w-score" ${ok ? '' : 'disabled'}>${editing ? 'Korrektur speichern' : 'Runde werten'}</button>
      </div>
    </div>`;
  }

  let table = '';
  if (!tooFew && W.rounds.length) {
    const max = Math.max(...ps.map(p => totals[p]));
    table = `<div class="sheet"><table>
      <thead><tr><th>Runde</th>${ps.map(p => `<th>${esc(p)}</th>`).join('')}</tr></thead>
      <tbody>
      ${W.rounds.map((r,i) => {
        const run = {}; ps.forEach(p => run[p] = 0);
        for (let j = 0; j <= i; j++) ps.forEach(p => run[p] += wRoundScore(W.rounds[j], p, j + 1, W.zero));
        return `<tr class="clickable ${W.cur === i ? 'current' : ''}" data-act="w-edit" data-i="${i}" title="Runde ${i+1} bearbeiten">
          <td class="cat">Runde ${i+1}</td>
          ${ps.map(p => { const s = wRoundScore(r, p, i + 1, W.zero); const c = r.cloud && r.cloud.p === p;
            return `<td class="wz">${run[p]}<small class="${s < 0 ? 'neg' : ''}">${s > 0 ? '+' : ''}${s} · ${c ? '☁' + wBid(r,p) : r.bids[p]}/${r.tricks[p]}</small></td>`; }).join('')}
        </tr>`; }).join('')}
      <tr class="total"><td>Stand</td>${ps.map(p => `<td>${totals[p] === max ? `<span class="lead">${totals[p]}</span>` : totals[p]}</td>`).join('')}</tr>
      </tbody></table></div>
`;
  }

  return `<div class="stack">
    ${playersBlock('wizard')}
    ${modePick}
    ${body}
    ${finished && !W.saved ? `<div class="winner"><div class="t">Alle ${maxRounds} Runden gespielt</div><div class="s">Speichern, damit es in der Bestenliste landet.</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn solid" data-act="w-finish">Ergebnis speichern</button></div></div>` : ''}
    ${W.saved ? winnerCard('wizard', W.saved) : ''}
    ${table}
    <div class="row between">
      <span class="label">${maxRounds ? `${W.rounds.length} von ${maxRounds} Runden` : ''}</span>
      <div class="row">
        <button class="btn ghost" data-act="w-new">Neues Spiel</button>
        ${!finished && W.rounds.length && !W.saved ? `<button class="btn" data-act="w-finish">Vorzeitig beenden</button>` : ''}
      </div>
    </div>
  </div>`;
}

/* ---------- Padel ---------- */
function pDisplay(P){
  const [a,b] = P.pts, g = P.sets[P.sets.length-1];
  const tb = g[0] === 6 && g[1] === 6;
  if (tb) return {labels:[String(a), String(b)], tb:true, adv:[false,false], info:'Tiebreak · bis 7, zwei Punkte Vorsprung'};
  const L = ['0','15','30','40'];
  if (a >= 3 && b >= 3) {
    if (a === b) return {labels:['40','40'], adv:[false,false], info: P.golden ? 'Golden Point · nächster Punkt gewinnt' : 'Einstand'};
    return a > b ? {labels:['Vorteil',''], adv:[true,false], info:'Vorteil'} : {labels:['','Vorteil'], adv:[false,true], info:'Vorteil'};
  }
  return {labels:[L[a], L[b]], adv:[false,false], info:''};
}
function setsWon(P){
  const w = [0,0];
  P.sets.forEach(([a,b]) => { if ((a >= 6 || b >= 6) && (Math.abs(a-b) >= 2 || a === 7 || b === 7)) w[a > b ? 0 : 1]++; });
  return w;
}
function pPoint(t){
  const P = S.padel; if (P.done !== null) return;
  P.undo.push(JSON.stringify({sets:P.sets, pts:P.pts, serve:P.serve}));
  if (P.undo.length > 200) P.undo.shift();
  const o = 1 - t, g = P.sets[P.sets.length-1];
  const tb = g[0] === 6 && g[1] === 6;
  P.pts[t]++;
  let gameWon = false;
  if (tb) gameWon = P.pts[t] >= 7 && P.pts[t] - P.pts[o] >= 2;
  else if (P.golden && P.pts[t] === 4 && P.pts[o] === 3) gameWon = true;
  else gameWon = P.pts[t] >= 4 && P.pts[t] - P.pts[o] >= 2;
  if (gameWon) {
    g[t]++; P.pts = [0,0]; P.serve = 1 - P.serve;
    const setDone = (g[t] >= 6 && g[t] - g[o] >= 2) || g[t] === 7;
    if (setDone) {
      const w = setsWon(P);
      if (w[t] === 2) { P.done = t; }
      else { P.sets.push([0,0]); toastQuip('set', {p: P.teams[t]}); }
    }
  }
  save(); render();
  if (P.done !== null) confetti();
}
function renderPadelPoints(){
  const P = S.padel, D = pDisplay(P), w = setsWon(P);
  const setCell = (i, t) => {
    const s = P.sets[i]; if (!s) return `<div class="set"></div>`;
    const complete = i < P.sets.length - 1 || P.done !== null;
    return `<div class="set ${complete && s[t] > s[1-t] ? 'won' : ''}">${s[t]}</div>`;
  };
  const teamRow = t => `<div class="team-row ${P.serve === t && P.done === null ? 'serve' : ''}">
    <input id="team-${t}" data-team="${t}" value="${esc(P.teams[t])}" aria-label="Name Team ${t+1}" maxlength="30">
    ${setCell(0,t)}${setCell(1,t)}${setCell(2,t)}
    <div class="game ${D.adv[t] ? 'adv' : ''}">${P.done !== null ? (P.done === t ? '✓' : '') : esc(D.labels[t])}</div>
  </div>`;
  const status = P.done !== null
    ? ''
    : `<div class="status">${D.info || `Satz ${P.sets.length} · ${w[0]}:${w[1]} Sätze`}</div>`;
  return `<div class="stack">
    <div class="court">
      <div class="court-head"><span>Team · ● schlägt auf</span><span>S1</span><span>S2</span><span>S3</span><span>Spiel</span></div>
      ${teamRow(0)}${teamRow(1)}
    </div>
    ${status}
    ${P.done === null ? `<div class="point-btns">
      <button data-act="p-point" data-t="0">Punkt<br>${esc(P.teams[0])}</button>
      <button data-act="p-point" data-t="1">Punkt<br>${esc(P.teams[1])}</button>
    </div>` : ''}
    ${P.done !== null && !P.saved ? `<div class="winner"><div class="t">${esc(P.teams[P.done])} gewinnt</div><div class="s">${P.sets.map(s => s.join(':')).join('  ·  ')}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn solid" data-act="p-finish">Ergebnis speichern</button></div></div>` : ''}
    ${P.saved ? winnerCard('padel', P.saved) : ''}
    <div class="row between">
      <label class="toggle"><input type="checkbox" id="golden" ${P.golden ? 'checked' : ''}> Golden Point statt Vorteil</label>
      <div class="row">
        <button class="btn ghost" data-act="p-undo" ${P.undo.length ? '' : 'disabled'}>↶ Rückgängig</button>
        <button class="btn ghost" data-act="p-new">Neues Match</button>
      </div>
    </div>
  </div>`;
}

/* Padel: Standard = nur Satzergebnisse eintragen, Punkte live nur auf Wunsch */
function padelSetWins(P){ const w = [0,0]; P.sets.forEach(([a,b]) => { if (a > b) w[0]++; else if (b > a) w[1]++; }); return w; }
function renderPadel(){
  const P = S.padel, mode = P.mode || 'sets';
  const toggle = `<div class="seg wide padel-mode" role="group" aria-label="Zählweise">
    <button data-act="p-mode" data-m="sets" aria-pressed="${mode === 'sets'}">Sätze eintragen</button>
    <button data-act="p-mode" data-m="points" aria-pressed="${mode === 'points'}">Punkte live</button></div>`;
  if (mode === 'points') return `<div class="stack">${viewMode ? '' : toggle}${renderPadelPoints()}</div>`;
  const w = padelSetWins(P), leader = w[0] === w[1] ? null : (w[0] > w[1] ? 0 : 1);
  const played = P.sets.some(x => x[0] + x[1] > 0), locked = !!P.saved;
  const step = (i, t) => `<div class="step ps-step">
      <button data-act="ps-step" data-i="${i}" data-t="${t}" data-d="-1" aria-label="Satz ${i+1} ${esc(P.teams[t])} weniger" ${locked ? 'disabled' : ''}>−</button>
      <output>${P.sets[i][t]}</output>
      <button data-act="ps-step" data-i="${i}" data-t="${t}" data-d="1" aria-label="Satz ${i+1} ${esc(P.teams[t])} mehr" ${locked ? 'disabled' : ''}>+</button></div>`;
  return `<div class="stack">
    ${viewMode ? '' : toggle}
    <div class="psets">
      <div class="pset head"><span></span>
        <input id="team-0" data-team="0" value="${esc(P.teams[0])}" aria-label="Name Team 1" maxlength="30" ${locked ? 'disabled' : ''}>
        <span></span>
        <input id="team-1" data-team="1" value="${esc(P.teams[1])}" aria-label="Name Team 2" maxlength="30" ${locked ? 'disabled' : ''}>
        <span></span></div>
      ${P.sets.map((x, i) => `<div class="pset ${x[0] > x[1] ? 'w0' : x[1] > x[0] ? 'w1' : ''}">
        <span class="ps-label">Satz ${i+1}</span>${step(i,0)}<b class="ps-colon">:</b>${step(i,1)}
        ${P.sets.length > 1 && !locked ? `<button class="x" data-act="ps-del" data-i="${i}" aria-label="Satz ${i+1} entfernen">×</button>` : '<span></span>'}
      </div>`).join('')}
    </div>
    ${!locked && P.sets.length < 5 ? `<div class="row"><button class="btn ghost small" data-act="ps-add">+ Satz</button></div>` : ''}
    <div class="status">${played ? `Sätze ${w[0]} : ${w[1]}${leader !== null ? ` · ${esc(P.teams[leader])} ${locked ? 'gewinnt' : 'vorne'}` : ''}` : 'Satzergebnisse eintragen'}</div>
    ${!locked && leader !== null ? `<div class="row" style="justify-content:center"><button class="btn solid" data-act="p-finish">Ergebnis speichern</button></div>` : ''}
    ${P.saved ? winnerCard('padel', P.saved) : ''}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="p-new">Neues Match</button></div>
  </div>`;
}

/* ---------- Flip 7 ---------- */
const F7_MODS = [2,4,6,8,10];
function f7Entry(d, p){ return d[p] || (d[p] = {nums:[], mods:[], x2:false, bust:false}); }
function f7Score(e){
  if (!e || e.bust) return 0;
  const sum = e.nums.reduce((s,n) => s + n, 0);
  return sum * (e.x2 ? 2 : 1) + e.mods.reduce((s,m) => s + m, 0) + (e.nums.length >= 7 ? 15 : 0);
}
function f7Totals(F){
  const t = {}; F.players.forEach(p => t[p] = 0);
  F.rounds.forEach(r => F.players.forEach(p => t[p] += f7Score(r[p])));
  return t;
}
function renderFlip(){
  const F = S.flip7, ps = F.players;
  if (!ps.length) return `<div class="stack">${playersBlock('flip7')}<div class="note"><b>Keine Spieler.</b> Füge oben Spieler hinzu.</div></div>`;
  const totals = f7Totals(F);
  const max = Math.max(...ps.map(p => totals[p]));
  const reached = F.rounds.length > 0 && max >= F.target;
  const finished = reached && F.cur >= F.rounds.length;
  const editing = F.cur < F.rounds.length;
  const d = F.draft;
  const before = {}; ps.forEach(p => before[p] = 0);
  F.rounds.slice(0, F.cur).forEach(r => ps.forEach(p => before[p] += f7Score(r[p])));
  const anyFlip7 = ps.some(p => d[p] && !d[p].bust && d[p].nums.length >= 7);

  const card = p => {
    const e = d[p] || {nums:[], mods:[], x2:false, bust:false};
    const sc = f7Score(e), full = e.nums.length >= 7;
    const numBtn = n => `<button class="f7-n n${n}" data-act="f7-num" data-p="${esc(p)}" data-v="${n}" aria-pressed="${e.nums.includes(n)}" aria-label="${esc(p)}: Zahl ${n}" ${full && !e.nums.includes(n) ? 'disabled' : ''}>${n}</button>`;
    const modBtn = m => `<button class="f7-m" data-act="f7-mod" data-p="${esc(p)}" data-v="${m}" aria-pressed="${e.mods.includes(m)}">+${m}</button>`;
    return `<div class="f7-card ${e.bust ? 'bust' : ''} ${full && !e.bust ? 'seven' : ''}">
      <div class="f7-head">
        <span class="f7-name">${esc(p)}</span>
        <span class="f7-tot">${before[p] + sc}<small> / ${F.target}</small></span>
        <span class="f7-sc">${e.bust ? 'RAUS' : (sc > 0 ? '+' + sc : '0')}</span>
      </div>
      <div class="f7-nums">${Array.from({length:13}, (_,n) => numBtn(n)).join('')}</div>
      <div class="f7-mods">
        ${F7_MODS.map(modBtn).join('')}
        <button class="f7-m x2" data-act="f7-x2" data-p="${esc(p)}" aria-pressed="${e.x2}">×2</button>
        <button class="f7-m bustbtn" data-act="f7-bust" data-p="${esc(p)}" aria-pressed="${e.bust}">Raus</button>
      </div>
      ${full && !e.bust ? `<div class="f7-flag">Flip 7! +15 Bonus</div>` : ''}
    </div>`;
  };

  let table = '';
  if (F.rounds.length) {
    table = `<div class="sheet"><table>
      <thead><tr><th>Runde</th>${ps.map(p => `<th>${esc(p)}</th>`).join('')}</tr></thead>
      <tbody>
      ${F.rounds.map((r,i) => {
        const run = {}; ps.forEach(p => run[p] = 0);
        for (let j = 0; j <= i; j++) ps.forEach(p => run[p] += f7Score(F.rounds[j][p]));
        return `<tr class="clickable ${F.cur === i ? 'current' : ''}" data-act="f7-edit" data-i="${i}">
          <td class="cat">Runde ${i+1}</td>
          ${ps.map(p => { const e = r[p]; const sc = f7Score(e);
            const tag = e && e.bust ? '<small class="neg">raus</small>' : e && e.nums.length >= 7 ? '<small>Flip 7!</small>' : `<small>+${sc}</small>`;
            return `<td class="wz">${run[p]}${tag}</td>`; }).join('')}
        </tr>`; }).join('')}
      <tr class="total"><td>Stand</td>${ps.map(p => `<td>${totals[p] === max && max > 0 ? `<span class="lead">${totals[p]}</span>` : totals[p]}</td>`).join('')}</tr>
      </tbody></table></div>`;
  }

  return `<div class="stack">
    ${playersBlock('flip7')}
    ${!finished ? `<div class="f7-round">
      <div class="row between">
        <div><div class="label">${editing ? 'Runde korrigieren' : 'Aktuelle Runde'}</div><div class="f7-big">Runde ${F.cur + 1}</div></div>
        <div class="label" style="text-align:right">Ziel ${F.target}</div>
      </div>
      ${anyFlip7 ? `<div class="f7-flag big">Flip 7! Die Runde endet, alle anderen sichern ihre Karten.</div>` : ''}
      <div class="f7-list">${ps.map(card).join('')}</div>
      <div class="row between">
        ${editing ? `<button class="btn ghost small" data-act="f7-back">Abbrechen</button>` : `<button class="btn ghost small" data-act="f7-clear">Eingaben leeren</button>`}
        <button class="btn solid" data-act="f7-score">${editing ? 'Korrektur speichern' : 'Runde werten'}</button>
      </div>
    </div>` : ''}
    ${finished && !F.saved ? `<div class="winner"><div class="label">${TITLES.flip7}</div><div class="t">${esc(ps.filter(p => totals[p] === max).join(' & '))} knackt ${F.target}</div><div class="s">Speichern, damit es in der Bestenliste landet.</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn solid" data-act="f7-finish">Ergebnis speichern</button></div></div>` : ''}
    ${F.saved ? winnerCard('flip7', F.saved) : ''}
    ${table}
    <div class="row between">
      <span></span>
      <div class="row">
        <button class="btn ghost" data-act="f7-new">Neues Spiel</button>
        ${!finished && F.rounds.length && !F.saved ? `<button class="btn" data-act="f7-finish">Vorzeitig beenden</button>` : ''}
      </div>
    </div>
  </div>`;
}

/* ---------- Gewinner & Titel ---------- */
const TITLES = { kniffel:'Würfelgott', wizard:'Stich-Orakel', padel:'Herrscher der Glaswand', flip7:'Glückspilz' };
const TYPE_LABEL = { kniffel:'Kniffel', wizard:'Wizard', padel:'Padel', flip7:'Flip 7' };
const LOSER = { kniffel:'Pechwürfel', wizard:'Falschansager', padel:'Netzroller', flip7:'Pleitegeier' };
function winnerCard(type, g){
  return `<div class="winner"><div class="label">${TITLES[type]}</div><div class="t">${esc(g.winners.join(' & '))}</div>
    <div class="s">${g.ranking.map((r,i) => `${i+1}. ${esc(r.name)} (${r.score})`).join(' · ')}</div>
    <div class="s">${esc(LOSER[type])}: <b>${esc(g.losers.join(' & '))}</b> · gespeichert in der Bestenliste</div>
    ${typeof quipFor === 'function' ? `<div class="quip">„${esc(quipFor(g))}“</div>` : ''}</div>`;
}
function buildResult(type, ranking){
  ranking.sort((a,b) => b.score - a.score);
  const top = ranking[0].score, bottom = ranking[ranking.length-1].score;
  return { type, ranking,
    winners: ranking.filter(r => r.score === top).map(r => r.name),
    losers: ranking.filter(r => r.score === bottom && bottom !== top).map(r => r.name) };
}
function boardRows(list){
  const stats = {};
  list.forEach(g => {
    const names = g.type === 'padel' ? g.ranking.flatMap(r => splitTeam(r.name)) : g.ranking.map(r => r.name);
    const wins = g.type === 'padel' ? g.winners.flatMap(splitTeam) : g.winners;
    const loses = g.type === 'padel' ? g.losers.flatMap(splitTeam) : g.losers;
    names.forEach(n => { stats[n] = stats[n] || {name:n, played:0, wins:0, last:0}; stats[n].played++; });
    wins.forEach(n => stats[n] && stats[n].wins++);
    loses.forEach(n => stats[n] && stats[n].last++);
  });
  return Object.values(stats).sort((a,b) => b.wins - a.wins || (b.wins/b.played) - (a.wins/a.played) || a.last - b.last);
}
function splitTeam(name){ return name.split(/\s*(?:&|\+|\/|,|\bund\b)\s*/i).map(s => s.trim()).filter(Boolean); }

/* ---------- Bestenliste ---------- */

        return `<div class="board-row">

          <span><span class="who"><button class="name-link" data-act="profile" data-name="${esc(r.name)}">${avatar(r.name)}${esc(r.name)}</button>${i === 0 && r.wins > 0 ? ' <span class="badge mark">Seriensieger</span>' : ''}${r.last === maxLast && maxLast > 0 ? ' <span class="badge dim">Rote Laterne</span>' : ''}</span><div class="bar"><i style="width:${q}%"></i></div></span>
          <span class="mono">${r.wins}</span><span class="mono">${r.played}</span><span class="mono">${q}%</span>
        </div>`; }).join('')}
    </div>` : `<div class="board"><div class="empty-state"><b>Noch keine Spiele</b>Beendet eine Partie Kniffel, Wizard, Flip 7 oder Padel, dann taucht hier auf, wer den Abend dominiert.</div></div>`}
    ${rows.length ? `<div class="row"><button class="btn small" data-act="export">Bestenliste als Bild teilen</button></div>` : ''}
    ${renderRecordsBlock(list)}
    ${renderRivalsBlock(list)}
    ${renderAccountsBlock()}
    ${list.length ? `<div><div class="label" style="margin-bottom:4px">Letzte Spiele</div><div class="log">
      ${list.slice(0,30).map(g => `<div class="log-item">
        <span class="type">${TYPE_LABEL[g.type] || g.type}</span>
        <span class="res clickable-res" data-act="game-detail" data-id="${esc(g.id)}" role="button" tabindex="0"><b>${esc(g.winners.join(' & '))}</b> gewinnt · ${g.ranking.map(r => `${esc(r.name)} ${r.score}`).join(', ')}<br><span class="when">${fmt(g.ts)}${g._pending ? ' · noch nicht gesendet' : ''}</span></span>
        <button class="x" data-act="del-game" data-id="${esc(g.id)}" aria-label="Spiel löschen" title="Spiel löschen">×</button>
      </div>`).join('')}
    </div></div>` : ''}
    ${pin ? `<div class="row"><button class="btn ghost small" data-act="pin-reset">PIN auf diesem Gerät vergessen</button></div>` : ''}
  </div>`;
}


/* ---------- Startseite ---------- */
function gameStatus(t){
  if (t === 'kniffel') {
    const K = S.kniffel; if (K.example) return 'Neues Spiel';
    if (K.saved) return 'Fertig · ' + esc(K.saved.winners.join(' & '));
    const f = S.players.reduce((n,p) => n + kTotals(K.scores[p]).filled, 0);
    return f ? `läuft · ${f}/${ALL_K.length * S.players.length} Felder` : 'Neues Spiel';
  }
  if (t === 'wizard') {
    const W = S.wizard; if (W.saved) return 'Fertig · ' + esc(W.saved.winners.join(' & '));
    const n = W.players.length, max = n >= 3 && n <= 6 ? 60 / n : 0;
    return W.rounds.length ? `läuft · Runde ${Math.min(W.rounds.length + 1, max)}/${max}` : 'Neues Spiel';
  }
  if (t === 'flip7') {
    const F = S.flip7; if (F.saved) return 'Fertig · ' + esc(F.saved.winners.join(' & '));
    if (!F.rounds.length) return 'Neues Spiel';
    const tot = f7Totals(F), lead = F.players.reduce((a,b) => tot[b] > tot[a] ? b : a, F.players[0]);
    return `läuft · ${esc(lead)} ${tot[lead]}`;
  }
  if (t === 'padel') {
    const P = S.padel; if (P.saved) return 'Fertig · ' + esc(P.saved.winners.join(' & '));
    const any = P.pts[0] + P.pts[1] > 0 || P.sets.some(x => x[0] + x[1] > 0);
    return any ? 'läuft · ' + P.sets.map(x => x.join(':')).join(' ') : 'Neues Match';
  }
  return '';
}

/* ---------- Render & Events ---------- */
function render(){
  document.documentElement.dataset.game = S.tab;
  document.body.dataset.view = S.tab === 'home' ? 'home' : 'page';
  const tc = {kniffel:'#f5f6f0', wizard:'#0d1130', padel:'#0f3d73', flip7:'#ffcf33'}[S.tab];
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', '#151514'));
  const app = $('#app');
  if (typeof updateWake === 'function') updateWake();
  app.innerHTML = S.tab === 'kniffel' ? renderKniffel() : S.tab === 'wizard' ? renderWizard() : S.tab === 'padel' ? renderPadel() : S.tab === 'flip7' ? renderFlip() : S.tab === 'board' ? renderBoard() : renderHome();
}

function goTo(tab){
  S.tab = tab; editingPlayers = false; playerMsg = ''; save(); render();
  window.scrollTo({top:0});
}
document.getElementById('brand').addEventListener('click', () => goTo('home'));

function applyPlayers(){
  const ps = S.players;
  // Kniffel: Spalten anpassen, vorhandene Werte behalten
  const K = S.kniffel;
  if (K.example) { S.kniffel = {scores:{}, example:false, saved:false}; }
  ps.forEach(p => { S.kniffel.scores[p] = S.kniffel.scores[p] || {}; });
  // Wizard: bei geänderter Besetzung neue Partie
  if (JSON.stringify(S.wizard.players) !== JSON.stringify(ps)) S.wizard = freshWizard(ps);
}

const app = $('#app');
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'edit-players') { editingPlayers = true; render(); setTimeout(() => $('#new-player')?.focus(), 0); return; }
  if (a === 'done-players') { editingPlayers = false; playerMsg = ''; if (S.tab !== 'flip7') applyPlayers(); save(); render(); return; }
  if (a === 'rm-player') { roster().splice(+el.dataset.i, 1); playerMsg = ''; save(); render(); return; }

  if (a === 'k-new') { S.kniffel = {scores:{}, example:false, saved:false}; S.players.forEach(p => S.kniffel.scores[p] = {}); save(); render(); return; }
  if (a === 'k-finish') {
    const res = buildResult('kniffel', S.players.map(p => ({name:p, score:kTotals(S.kniffel.scores[p]).total})));
    S.kniffel.saved = res; save(); render(); confetti(); await recordGame({...res, detail:{players:[...S.players], scores:JSON.parse(JSON.stringify(S.kniffel.scores))}}); return;
  }

  const F = S.flip7;
  if (a.startsWith('f7-')) {
    const p = el.dataset.p;
    if (a === 'f7-num') {
      const e = f7Entry(F.draft, p), v = +el.dataset.v;
      e.nums = e.nums.includes(v) ? e.nums.filter(x => x !== v) : (e.nums.length < 7 ? [...e.nums, v].sort((x,y) => x-y) : e.nums);
      save(); render(); if (e.nums.length === 7 && !e.bust) { confetti(); toastQuip('flip7', {p}); } return;
    }
    if (a === 'f7-mod') {
      const e = f7Entry(F.draft, p), v = +el.dataset.v;
      e.mods = e.mods.includes(v) ? e.mods.filter(x => x !== v) : [...e.mods, v]; save(); render(); return;
    }
    if (a === 'f7-x2') { const e = f7Entry(F.draft, p); e.x2 = !e.x2; save(); render(); return; }
    if (a === 'f7-bust') { const e = f7Entry(F.draft, p); e.bust = !e.bust; save(); render(); if (e.bust) toastQuip('bust', {p}); return; }
    if (a === 'f7-clear') { F.draft = {}; save(); render(); return; }
    if (a === 'f7-score') {
      const r = {};
      F.players.forEach(pl => { r[pl] = JSON.parse(JSON.stringify(F.draft[pl] || {nums:[], mods:[], x2:false, bust:false})); });
      if (F.cur < F.rounds.length) F.rounds[F.cur] = r; else F.rounds.push(r);
      F.cur = F.rounds.length; F.draft = {}; F.saved = false; save(); render();
      const t = f7Totals(F); if (Math.max(...F.players.map(pl => t[pl])) >= F.target) confetti();
      window.scrollTo({top:0, behavior:'smooth'}); return;
    }
    if (a === 'f7-edit') { const i = +el.dataset.i; F.cur = i; F.draft = JSON.parse(JSON.stringify(F.rounds[i])); save(); render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    if (a === 'f7-back') { F.cur = F.rounds.length; F.draft = {}; save(); render(); return; }
    if (a === 'f7-new') { S.flip7 = freshFlip(F.players); save(); render(); return; }
    if (a === 'f7-finish') {
      const t = f7Totals(F);
      const res = buildResult('flip7', F.players.map(pl => ({name:pl, score:t[pl]})));
      F.saved = res; F.cur = F.rounds.length; save(); render(); confetti(); await recordGame({...res, detail:{players:[...F.players], rounds:JSON.parse(JSON.stringify(F.rounds)), target:F.target}}); return;
    }
    return;
  }

  const W = S.wizard;
  if (a === 'w-step') {
    const {kind, p} = el.dataset, dd = +el.dataset.d, max = W.cur + 1;
    const v = W.draft[kind][p];
    let nv = v === undefined ? (dd > 0 ? 0 : 0) : v + dd;
    if (v === undefined && dd > 0) nv = 0;
    nv = Math.max(0, Math.min(max, nv));
    W.draft[kind][p] = nv; save(); render(); return;
  }
  if (a === 'w-score') {
    const r = {bids:{...W.draft.bids}, tricks:{...W.draft.tricks}, cloud: W.draft.cloud ? {...W.draft.cloud} : null};
    if (W.cur < W.rounds.length) W.rounds[W.cur] = r; else W.rounds.push(r);
    W.cur = W.rounds.length; W.draft = {bids:{}, tricks:{}}; W.saved = false; save(); render(); quipWizardRound(r, W.players); return;
  }
  if (a === 'w-edit') {
    const i = +el.dataset.i; W.cur = i;
    W.draft = {bids:{...W.rounds[i].bids}, tricks:{...W.rounds[i].tricks}, cloud: W.rounds[i].cloud ? {...W.rounds[i].cloud} : null}; save(); render();
    $('.round')?.scrollIntoView({behavior:'smooth', block:'start'}); return;
  }
  if (a === 'w-cloud-d') { if (W.draft.cloud) { W.draft.cloud.d = +el.dataset.d; save(); render(); } return; }
  if (a === 'w-back') { W.cur = W.rounds.length; W.draft = {bids:{}, tricks:{}}; save(); render(); return; }
  if (a === 'w-zero') { if (W.rounds.length === 0 && !W.saved) { W.zero = el.dataset.v === '1'; S.wizardZero = W.zero; save(); render(); } return; }
  if (a === 'w-new') { S.wizard = freshWizard(S.players); save(); render(); return; }
  if (a === 'w-finish') {
    const t = wTotals(W);
    const res = buildResult('wizard', W.players.map(p => ({name:p, score:t[p]})));
    W.saved = res; W.cur = W.rounds.length; save(); render(); confetti(); await recordGame({...res, detail:{players:[...W.players], rounds:JSON.parse(JSON.stringify(W.rounds)), zero:!!W.zero}}); return;
  }

  const P = S.padel;
  if (a === 'p-point') { pPoint(+el.dataset.t); return; }
  if (a === 'p-undo') {
    const last = P.undo.pop(); if (!last) return;
    const o = JSON.parse(last); P.sets = o.sets; P.pts = o.pts; P.serve = o.serve; P.done = null; P.saved = false;
    save(); render(); return;
  }
  if (a === 'p-new') { const teams = P.teams, golden = P.golden, mode = P.mode; S.padel = freshPadel(); S.padel.teams = teams; S.padel.golden = golden; S.padel.mode = mode; save(); render(); return; }
  if (a === 'p-mode') {
    const m = el.dataset.m; if ((P.mode || 'sets') === m) return;
    P.mode = m;
    if (m === 'points' && !P.saved) {
      // weiterzählen: abgeschlossenen letzten Satz nicht weiterführen, Sieger erkennen
      const w = setsWon(P); P.done = w[0] >= 2 ? 0 : w[1] >= 2 ? 1 : null; P.pts = [0,0]; P.undo = [];
      const L = P.sets[P.sets.length - 1], fin = (L[0] >= 6 || L[1] >= 6) && (Math.abs(L[0] - L[1]) >= 2 || L[0] === 7 || L[1] === 7);
      if (P.done === null && fin) P.sets.push([0,0]);
    }
    if (m === 'sets' && P.sets.length > 1) { const L = P.sets[P.sets.length - 1]; if (L[0] + L[1] === 0) P.sets.pop(); }
    save(); render(); return;
  }
  if (a === 'ps-step') { if (P.saved) return; const i = +el.dataset.i, t = +el.dataset.t; P.sets[i][t] = Math.max(0, Math.min(9, P.sets[i][t] + (+el.dataset.d))); save(); render(); return; }
  if (a === 'ps-add') { if (P.sets.length < 5) P.sets.push([0,0]); save(); render(); return; }
  if (a === 'ps-del') { P.sets.splice(+el.dataset.i, 1); if (!P.sets.length) P.sets.push([0,0]); save(); render(); return; }
  if (a === 'p-finish') {
    const w = (P.mode || 'sets') === 'sets' ? padelSetWins(P) : setsWon(P);
    if ((P.mode || 'sets') === 'sets') { if (w[0] === w[1]) return; P.done = w[0] > w[1] ? 0 : 1; P.sets = P.sets.filter(x => x[0] + x[1] > 0); }
    const res = buildResult('padel', [{name:P.teams[0], score:w[0]}, {name:P.teams[1], score:w[1]}]);
    P.saved = res; save(); render(); await recordGame({...res, detail:{teams:[...P.teams], sets:JSON.parse(JSON.stringify(P.sets)), winner:P.done}}); return;
  }

  if (a === 'go') { goTo(el.dataset.t); return; }
  if (a === 'tool') { openSheet({kind: el.dataset.k}); return; }
  if (a === 'filter') { boardFilter = el.dataset.f; render(); return; }
  if (a === 'profile') { openSheet({kind:'profile', name: el.dataset.name}); return; }
  if (a === 'account') { openSheet({kind:'account'}); return; }
  if (a === 'game-detail') { openSheet({kind:'game', id: el.dataset.id}); return; }
  if (a === 'export') { exportBoard(); return; }
  if (a === 'pin-reset') { pin = ''; store(LS_PIN, ''); pinError = ''; setSync(); render(); return; }
  if (a === 'del-game') {
    if (el.dataset.confirm) { deleteGame(el.dataset.id); }
    else { el.dataset.confirm = '1'; el.textContent = 'Löschen?'; el.style.width = 'auto'; el.style.fontSize = '12px'; el.style.color = 'var(--mark)'; }
    return;
  }
});

/* ---------- kleine Helfer ---------- */
function hashStr(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const pickFrom = (arr, seed) => arr[(seed === undefined ? Math.floor(Math.random() * arr.length) : seed % arr.length)];
const fill = (tpl, v) => tpl.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
const fmtAgo = iso => { const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)); return s < 60 ? `vor ${s} s` : s < 3600 ? `vor ${Math.round(s/60)} min` : `vor ${Math.round(s/3600)} h`; };

function toast(msg){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3400);
}

function toastQuip(kind, v){ const arr = QUIPS[kind]; if (arr) toast(fill(pickFrom(arr), v)); }
function quipFor(g){
  const seed = hashStr(JSON.stringify([g.winners, g.losers, g.ranking.map(r => r.score)]));
  if (g.winners.length > 1) return pickFrom(QUIPS.tie, seed);
  if (g.losers.length && seed % 2) return fill(pickFrom(QUIPS.last, seed >>> 3), {l: g.losers.join(' & ')});
  return fill(pickFrom(QUIPS.win, seed >>> 3), {w: g.winners.join(' & ')});
}
function quipWizardRound(r, players){
  const misses = players.map(p => ({p, n: Math.abs(wBid(r, p) - r.tricks[p])})).filter(x => x.n > 0).sort((a,b) => b.n - a.n);
  if (!misses.length) return toastQuip('wizardAll', {});
  if (misses.length === players.length && players.length > 2) return toastQuip('wizardNone', {});
  if (misses[0].n >= 2) toastQuip('wizardMiss', misses[0]);
}

async function imageFileToDataURL(file, size){
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('Das ist kein Bild.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.')); i.src = url; });
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Statistik ---------- */
function participants(g){ return g.type === 'padel' ? g.ranking.flatMap(r => splitTeam(r.name)) : g.ranking.map(r => r.name); }
function winnersOf(g){ return g.type === 'padel' ? g.winners.flatMap(splitTeam) : g.winners; }
function losersOf(g){ return g.type === 'padel' ? g.losers.flatMap(splitTeam) : g.losers; }
const chrono = list => [...list].sort((a,b) => a.ts - b.ts);

function headToHead(list){
  const m = {};
  list.forEach(g => {
    const pairs = [];
    if (g.type === 'padel') { winnersOf(g).forEach(w => losersOf(g).forEach(l => pairs.push([w, l, 1]))); }
    else { const r = g.ranking; for (let i = 0; i < r.length; i++) for (let j = i+1; j < r.length; j++) pairs.push([r[i].name, r[j].name, Math.sign(r[i].score - r[j].score)]); }
    pairs.forEach(([x, y, res]) => {
      const [a, b] = x < y ? [x, y] : [y, x];
      const o = m[a + '|' + b] || (m[a + '|' + b] = {a, b, wa:0, wb:0, t:0});
      if (res === 0) o.t++; else if ((res > 0 ? x : y) === a) o.wa++; else o.wb++;
    });
  });
  return Object.values(m).map(o => ({...o, n: o.wa + o.wb + o.t}));
}

// Kennzahlen je Spieler über alle Spiele
function playerStats(name, list){
  const games = chrono(list.filter(g => participants(g).includes(name)));
  const st = {name, played: games.length, wins:0, lasts:0, byType:{}, bestStreak:0, lastStreakMax:0, form:[],
    kniffelMax:null, kniffel50:0, bonusCount:0, wizardBestRate:null, wizardMax:null, flipBestRound:0, flip7Count:0, bustCount:0, bustsOneGame:0, padelBagel:false};
  let streak = 0, lstreak = 0;
  games.forEach(g => {
    const won = winnersOf(g).includes(name), last = losersOf(g).includes(name);
    const bt = st.byType[g.type] || (st.byType[g.type] = {played:0, wins:0});
    bt.played++; if (won) { bt.wins++; st.wins++; }
    if (last) st.lasts++;
    streak = won ? streak + 1 : 0; st.bestStreak = Math.max(st.bestStreak, streak);
    lstreak = last ? lstreak + 1 : 0; st.lastStreakMax = Math.max(st.lastStreakMax, lstreak);
    st.form.push(won ? 'S' : last ? 'L' : '·');
    const myScore = (g.ranking.find(r => r.name === name) || {}).score;
    const d = g.detail;
    if (g.type === 'kniffel') {
      if (myScore != null) st.kniffelMax = Math.max(st.kniffelMax ?? 0, myScore);
      const sc = d && d.scores && d.scores[name];
      if (sc) { if (sc.kn === 50) st.kniffel50++; if (kTotals(sc).bonus) st.bonusCount++; }
    }
    if (g.type === 'wizard') {
      if (myScore != null) st.wizardMax = Math.max(st.wizardMax ?? -Infinity, myScore);
      if (d && d.rounds && d.rounds.length >= 5) {
        const hits = d.rounds.filter(r => r.bids[name] !== undefined && wBid(r, name) === r.tricks[name]).length;
        st.wizardBestRate = Math.max(st.wizardBestRate ?? 0, hits / d.rounds.length);
      }
    }
    if (g.type === 'flip7' && d && d.rounds) {
      let busts = 0;
      d.rounds.forEach(r => { const e = r[name]; if (!e) return; st.flipBestRound = Math.max(st.flipBestRound, f7Score(e)); if (e.bust) busts++; else if (e.nums.length >= 7) st.flip7Count++; });
      st.bustCount += busts; st.bustsOneGame = Math.max(st.bustsOneGame, busts);
    }
    if (g.type === 'padel' && won && d && d.sets) {
      const wi = d.winner; if (d.sets.some(s => s[wi] === 6 && s[1 - wi] === 0)) st.padelBagel = true;
    }
  });
  st.form = st.form.slice(-10);
  return st;
}

  {id:'seer', t:'Hellseher', d:'80 % Treffer in einer Wizard-Partie', ok:s => (s.wizardBestRate ?? 0) >= 0.8},
  {id:'f7', t:'Flip 7!', d:'Sieben verschiedene Zahlen', ok:s => s.flip7Count >= 1},
  {id:'gambler', t:'Zocker', d:'3× raus in einer Flip-7-Partie', ok:s => s.bustsOneGame >= 3},
  {id:'bagel', t:'Zu Null', d:'Padel-Satz 6:0 gewonnen', ok:s => s.padelBagel},
  {id:'lantern', t:'Dauerabo hinten', d:'3× in Folge Letzter', ok:s => s.lastStreakMax >= 3},
];

function computeRecords(list){
  const recs = [];
  const games = chrono(list);
  const add = (type, title, value, who, g) => { if (who && value !== null && value !== undefined && value !== -Infinity) recs.push({type, title, value, who, ts: g ? g.ts : null, id: g ? g.id : null}); };
  // Allgemein: längste Siegesserie
  const names = [...new Set(games.flatMap(participants))];
  let bestS = {v:0, who:null};
  names.forEach(n => { const s = playerStats(n, games).bestStreak; if (s > bestS.v) bestS = {v:s, who:n}; });
  if (bestS.v >= 2) add('alle', 'Längste Siegesserie', `${bestS.v} Siege`, bestS.who, null);
  // Bester Abend: meiste Siege an einem Tag
  const perDay = {};
  games.forEach(g => { const day = new Date(g.ts).toDateString(); winnersOf(g).forEach(w => { const k = day + '|' + w; perDay[k] = (perDay[k] || {n:0, w, ts:g.ts}); perDay[k].n++; }); });
  const bd = Object.values(perDay).sort((a,b) => b.n - a.n)[0];
  if (bd && bd.n >= 2) add('alle', 'Bester Abend', `${bd.n} Siege am ${fmtDate(bd.ts)}`, bd.w, null);
  // Kniffel
  let km = null; games.filter(g => g.type === 'kniffel').forEach(g => g.ranking.forEach(r => { if (!km || r.score > km.v) km = {v:r.score, who:r.name, g}; }));
  if (km) add('kniffel', 'Höchste Kniffel-Punktzahl', `${km.v} Punkte`, km.who, km.g);
  const knCount = {}; games.filter(g => g.type === 'kniffel' && g.detail && g.detail.scores).forEach(g => Object.entries(g.detail.scores).forEach(([n, sc]) => { if (sc.kn === 50) knCount[n] = (knCount[n] || 0) + 1; }));
  const knTop = Object.entries(knCount).sort((a,b) => b[1] - a[1])[0];
  if (knTop) add('kniffel', 'Meiste Kniffel', `${knTop[1]}×`, knTop[0], null);
  // Wizard
  let wm = null; games.filter(g => g.type === 'wizard').forEach(g => g.ranking.forEach(r => { if (!wm || r.score > wm.v) wm = {v:r.score, who:r.name, g}; }));
  if (wm) add('wizard', 'Höchster Wizard-Endstand', `${wm.v} Punkte`, wm.who, wm.g);
  let wr = null; games.filter(g => g.type === 'wizard' && g.detail && g.detail.rounds && g.detail.rounds.length >= 5).forEach(g => g.detail.players.forEach(n => {
    const hits = g.detail.rounds.filter(r => r.bids[n] !== undefined && wBid(r, n) === r.tricks[n]).length, rate = hits / g.detail.rounds.length;
    if (!wr || rate > wr.v) wr = {v:rate, who:n, g, hits, of:g.detail.rounds.length};
  }));
  if (wr) add('wizard', 'Beste Trefferquote', `${Math.round(wr.v*100)} % (${wr.hits}/${wr.of})`, wr.who, wr.g);
  // Flip 7
  let fr = null, f7c = {}, bc = {};
  games.filter(g => g.type === 'flip7' && g.detail && g.detail.rounds).forEach(g => g.detail.rounds.forEach(r => Object.entries(r).forEach(([n, e]) => {
    const sc = f7Score(e); if (!fr || sc > fr.v) fr = {v:sc, who:n, g};
    if (e.bust) bc[n] = (bc[n] || 0) + 1; else if (e.nums.length >= 7) f7c[n] = (f7c[n] || 0) + 1;
  })));
  if (fr && fr.v > 0) add('flip7', 'Beste Flip-7-Runde', `${fr.v} Punkte`, fr.who, fr.g);
  const f7Top = Object.entries(f7c).sort((a,b) => b[1] - a[1])[0]; if (f7Top) add('flip7', 'Meiste Flip 7', `${f7Top[1]}×`, f7Top[0], null);
  const bTop = Object.entries(bc).sort((a,b) => b[1] - a[1])[0]; if (bTop) add('flip7', 'Pleitegeier (meiste Raus)', `${bTop[1]}×`, bTop[0], null);
  let fq = null; games.filter(g => g.type === 'flip7' && g.detail && g.detail.rounds && g.ranking[0].score >= (g.detail.target || 200)).forEach(g => { const n = g.detail.rounds.length; if (!fq || n < fq.v) fq = {v:n, who:g.winners.join(' & '), g}; });
  if (fq) add('flip7', 'Schnellster Flip-7-Sieg', `${fq.v} Runden`, fq.who, fq.g);
  // Padel
  let pd = null; games.filter(g => g.type === 'padel' && g.detail && g.detail.sets).forEach(g => {
    const wi = g.detail.winner; if (wi === null || wi === undefined) return;
    const diff = g.detail.sets.reduce((s, x) => s + x[wi] - x[1 - wi], 0);
    if (!pd || diff > pd.v) pd = {v:diff, who:g.winners.join(' & '), g, sets:g.detail.sets.map(x => wi === 0 ? x.join(':') : [x[1], x[0]].join(':')).join(' ')};
  });
  if (pd) add('padel', 'Deutlichster Padel-Sieg', pd.sets, pd.who, pd.g);
  return recs;
}

function renderRecordsBlock(list){
  const recs = computeRecords(list).filter(r => boardFilter === 'alle' || r.type === boardFilter || r.type === 'alle');
  if (!recs.length) return '';
  return `<div><div class="label" style="margin-bottom:6px">Rekorde</div><div class="records">
    ${recs.map(r => `<div class="rec ${r.id ? 'clickable-res' : ''}" ${r.id ? `data-act="game-detail" data-id="${esc(r.id)}" role="button" tabindex="0"` : ''}>
      <span class="rec-t">${esc(r.title)}</span><span class="rec-v">${esc(r.value)}</span><span class="rec-w">${esc(r.who)}${r.ts ? ` · ${fmtDate(r.ts)}` : ''}</span></div>`).join('')}
  </div></div>`;
}
function renderRivalsBlock(list){
  const h = headToHead(list).filter(o => o.n >= 2).sort((a,b) => b.n - a.n || Math.abs(a.wa - a.wb) - Math.abs(b.wa - b.wb)).slice(0, 4);

    </div>`).join('')}
  </div></div>`;
}

document.body.appendChild(sheetEl);
let sheetView = null, sheetThemeBefore = null;
function openSheet(view){
  if (sheetView && sheetView.cleanup) sheetView.cleanup();
  sheetView = view; sheetEl.hidden = false; document.body.classList.add('sheet-open');
  renderSheet();
  sheetEl.querySelector('.sheet-panel').scrollTop = 0;
}
function closeSheet(){
  if (sheetView && sheetView.cleanup) sheetView.cleanup();
  sheetView = null; sheetEl.hidden = true; document.body.classList.remove('sheet-open');
  if (sheetThemeBefore) { document.documentElement.dataset.game = sheetThemeBefore; sheetThemeBefore = null; }
}
function setSheetTheme(type){
  if (!sheetThemeBefore) sheetThemeBefore = document.documentElement.dataset.game;
  document.documentElement.dataset.game = type || sheetThemeBefore;
}
function renderSheet(){
  if (!sheetView) return;
  const v = sheetView;

  if (['live','game'].includes(v.kind)) {} else if (sheetThemeBefore) { document.documentElement.dataset.game = sheetThemeBefore; sheetThemeBefore = null; }
  $('#sheet-body').innerHTML = fn ? fn(v) : '';
  if (v.after) v.after();
}

function dieHTML(val){

/* Finger-Auswahl */
function setupFingers(zone){
  if (!zone) return;
  const colors = ['#e0352b','#1c80c4','#1f9a55','#c99700','#6d48d6','#cc3a8c','#10948d','#e8772e','#3a5bd8','#b8323f'];
  const touches = new Map(); let timer = null, done = false, used = 0;
  const msg = t => { const m = $('#finger-msg'); if (m) m.textContent = t; };
  const place = (t) => { t.el.style.left = t.x + 'px'; t.el.style.top = t.y + 'px'; };
  const pos = e => { const r = zone.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  const arm = () => {
    clearTimeout(timer); if (done) return;
    if (touches.size >= 2) { msg('Stillhalten …'); timer = setTimeout(pick, 1800); }
    else msg(touches.size ? 'Noch mehr Finger!' : 'Alle legen einen Finger aufs Display und halten still');
  };
  const pick = () => {
    const ids = [...touches.keys()], w = ids[Math.floor(Math.random() * ids.length)];
    done = true;
    touches.forEach((t, id) => t.el.classList.add(id === w ? 'win' : 'lose'));
    navigator.vibrate && navigator.vibrate(90);
    msg('Du fängst an!');
  };
  zone.addEventListener('pointerdown', e => {
    if (done) return;
    e.preventDefault();
    try { zone.setPointerCapture(e.pointerId); } catch(_) {}
    const el = document.createElement('div'); el.className = 'fdot'; el.style.setProperty('--c', colors[used++ % colors.length]);
    zone.appendChild(el);
    const t = {...pos(e), el}; touches.set(e.pointerId, t); place(t); arm();
  });
  zone.addEventListener('pointermove', e => { const t = touches.get(e.pointerId); if (!t || done) return; Object.assign(t, pos(e)); place(t); });
  const up = e => {
    const t = touches.get(e.pointerId); if (!t) return;
    touches.delete(e.pointerId);
    if (done) {
      if (!t.el.classList.contains('win')) t.el.remove();
      if (!touches.size) setTimeout(() => { zone.querySelectorAll('.fdot').forEach(d => d.remove()); done = false; used = 0; arm(); }, 1600);
      return;
    }
    t.el.remove(); arm();
  };
  zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up);
  sheetView.cleanup = () => clearTimeout(timer);
}

/* ---------- Live teilen & zuschauen ---------- */
let liveTimer = null, liveActive = false, liveType = GAME_TYPES.includes(S.tab) ? S.tab : null, liveLastJson = '';
function inProgress(type){
  if (type === 'kniffel') { const K = S.kniffel; return !K.example && !K.saved && S.players.some(p => Object.keys(K.scores[p] || {}).length); }
  if (type === 'wizard') { const W = S.wizard; return !W.saved && (W.rounds.length > 0 || Object.keys(W.draft.bids || {}).length > 0); }
  if (type === 'flip7') { const F = S.flip7; return !F.saved && (F.rounds.length > 0 || Object.keys(F.draft || {}).length > 0); }
  if (type === 'padel') { const P = S.padel; return !P.saved && (P.pts[0] + P.pts[1] > 0 || P.sets.some(s => s[0] + s[1] > 0)); }
  return false;
}
function liveStateOf(type){
  if (type === 'kniffel') return {players:S.players, kniffel:S.kniffel};
  if (type === 'wizard') return {wizard:S.wizard};
  if (type === 'flip7') return {flip7:S.flip7};
  return {padel:{...S.padel, undo:[]}};
}
function liveSchedule(){
  if (GAME_TYPES.includes(S.tab)) liveType = S.tab;
  clearTimeout(liveTimer); liveTimer = setTimeout(livePush, 1200);
}
async function livePush(){
  if (!pin || !S.liveShare || !liveType) return;
  if (!inProgress(liveType)) { if (liveActive) liveClear(); return; }
  const body = JSON.stringify({p_pin: pin, p_id: DEVICE_ID, p_type: liveType, p_state: liveStateOf(liveType)});
  if (body === liveLastJson) return;
  try { await sb('/rest/v1/rpc/set_live', {method:'POST', body}); liveActive = true; liveLastJson = body; } catch(e) {}
}
async function liveClear(){
  liveActive = false; liveLastJson = '';
  if (!pin) return;
  try { await sb('/rest/v1/rpc/clear_live', {method:'POST', body: JSON.stringify({p_pin: pin, p_id: DEVICE_ID})}); } catch(e) {}
}

  x.font = '600 22px "JetBrains Mono", monospace';
  x.fillText('SIEGE', 690, top - 12); x.fillText('SPIELE', 810, top - 12); x.fillText('QUOTE', 940, top - 12);
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    x.fillStyle = i % 2 ? paper : '#f1f1ec'; x.fillRect(60, y, W - 120, rowH);
    x.fillStyle = i === 0 ? mark : ink; x.font = '900 52px "Big Shoulders Display", Impact, sans-serif'; x.fillText(String(i + 1), 80, y + 62);
    const p = profileOf(r.name); x.fillStyle = ink; x.font = '600 38px "Instrument Sans", system-ui, sans-serif';
    x.fillText(((p && p.emoji) ? p.emoji + ' ' : '') + r.name, 160, y + 56);
    x.font = '700 36px "JetBrains Mono", monospace';
    const q = Math.round(100 * r.wins / r.played);
    x.fillText(String(r.wins), 700, y + 56); x.fillText(String(r.played), 830, y + 56); x.fillText(q + '%', 930, y + 56);
    x.fillStyle = '#dcdcd5'; x.fillRect(160, y + 70, 480, 5); x.fillStyle = ink; x.fillRect(160, y + 70, 480 * q / 100, 5);
  });
  x.fillStyle = muted; x.font = '500 24px "JetBrains Mono", monospace';
  x.fillText(location.host + location.pathname.replace(/index\.html$/, ''), 62, H - 50);
  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  const file = new File([blob], 'spieleabend-bestenliste.png', {type:'image/png'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Spieleabend Bestenliste'}); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'spieleabend-bestenliste.png'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Bild gespeichert.');
}

render();
setSync();
sync();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
